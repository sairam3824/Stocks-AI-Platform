services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  web:
    build: .
    command: sh -c "python -m alembic upgrade head && gunicorn --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 180 src.webapp:app"
    environment:
      - PORT=8000
      - SESSION_COOKIE_SECURE=0
      - STOCKS_CONFIG_PATH=config/portfolio.json
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      - redpanda
      - redis
    ports:
      - "8000:8000"

  worker:
    build: .
    command: python -m src.worker --config config/portfolio.json
    environment:
      - STOCKS_CONFIG_PATH=config/portfolio.json
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      - redis
      - web

  producer:
    build: .
    command: python -m src.live_producer --config config/portfolio.json
    environment:
      - STOCKS_CONFIG_PATH=config/portfolio.json
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:9092
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./:/app
    depends_on:
      - redpanda
      - web

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
